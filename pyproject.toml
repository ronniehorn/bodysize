[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ronniehorn-bodysize"
version = "0.1.0"
description = "按段落统计网关的请求体大小限制相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ronniehorn" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ronniehorn.github.io"
Repository = "https://github.com/ronniehorn/bodysize"
Issues = "https://github.com/ronniehorn/bodysize/issues"

[project.scripts]
bodysize = "bodysize:main"

[tool.setuptools]
py-modules = ["bodysize"]
